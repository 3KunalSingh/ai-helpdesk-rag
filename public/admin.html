<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - IT Helpdesk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin-style.css">
</head>
<body>
  <header class="admin-header">
    <div class="header-left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#6366f1"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
      <h1>Admin Dashboard</h1>
    </div>
    <div class="header-right">
      <span id="adminName" class="admin-name"></span>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </header>

  <main class="admin-container">
    <div class="admin-tabs">
      <button class="admin-tab active" data-target="ticketsPanel">Tickets</button>
      <button class="admin-tab" data-target="documentsPanel">Documents</button>
    </div>

    <!-- TICKETS PANEL -->
    <section id="ticketsPanel" class="panel active">
      <div class="panel-header">
        <h2>Support Tickets</h2>
        <button id="refreshTickets" class="btn-secondary">Refresh</button>
      </div>
      <div id="ticketsList" class="items-list"></div>
    </section>

    <!-- DOCUMENTS PANEL -->
    <section id="documentsPanel" class="panel">
      <div class="panel-header">
        <h2>Knowledge Base Documents</h2>
        <button id="showAddDocForm" class="btn-primary-sm">+ Add Document</button>
      </div>
      <div id="docFormContainer" class="doc-form hidden">
        <h3 id="docFormTitle">Add New Document</h3>
        <input type="hidden" id="editDocId">
        <div class="form-group"><label for="docTitleInput">Title</label><input type="text" id="docTitleInput" placeholder="Document title"></div>
        <div class="form-group"><label for="docContentInput">Content</label><textarea id="docContentInput" rows="6" placeholder="Document content..."></textarea></div>
        <div class="form-actions">
          <button id="saveDocBtn" class="btn-primary-sm">Save Document</button>
          <button id="cancelDocBtn" class="btn-secondary">Cancel</button>
        </div>
        <div id="docFormMsg" class="form-msg hidden"></div>
      </div>
      <div id="documentsList" class="items-list"></div>
    </section>
  </main>

  <!-- Ticket Detail Modal -->
  <div id="ticketModal" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Ticket Details</h3>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-row"><span class="detail-label">Question</span><p id="modalQuestion"></p></div>
        <div class="detail-row"><span class="detail-label">AI Answer</span><p id="modalAiAnswer"></p></div>
        <div class="detail-row"><span class="detail-label">Confidence</span><span id="modalConfidence" class="badge"></span></div>
        <div class="detail-row"><span class="detail-label">Status</span>
          <select id="modalStatus"><option value="Pending">Pending</option><option value="Resolved">Resolved</option><option value="Closed">Closed</option></select>
        </div>
        <div class="detail-row"><span class="detail-label">Created</span><span id="modalDate"></span></div>
        <div class="detail-row"><span class="detail-label">Admin Reply</span>
          <textarea id="modalReply" rows="3" placeholder="Type your reply..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="saveTicketBtn" class="btn-primary-sm">Save Changes</button>
        <button id="deleteTicketBtn" class="btn-danger">Delete Ticket</button>
        <div id="ticketModalMsg" class="form-msg hidden"></div>
      </div>
    </div>
  </div>

  <script src="admin-script.js"></script>
</body>
</html>
